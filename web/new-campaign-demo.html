<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新建跑团</title>
  <link rel="stylesheet" href="/app.css?v=17">
  <style>
    html,
    body {
      overflow: hidden;
    }
    body.dragScrolling {
      cursor: grabbing;
      user-select: none;
    }
    body.dragScrolling * {
      cursor: grabbing !important;
    }
    .createShell {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      margin: 0;
      padding: 22px 14px;
      overflow: auto;
      cursor: grab;
    }
    .createLayout {
      width: min(1180px, 100%);
      margin: 0 auto;
      min-height: calc(100dvh - 44px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 16px;
    }
    .createMain,
    .rulesSide {
      min-height: 0;
      padding: 20px;
    }
    .createHeader {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      margin-bottom: 18px;
    }
    .createHeader h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
    }
    .createHeader p,
    .hintLine,
    .checkText small {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 13px;
    }
    .createForm {
      display: grid;
      gap: 14px;
    }
    .formGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .formSection {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.52);
      padding: 14px;
      display: grid;
      gap: 12px;
    }
    .formSection h2 {
      margin: 0;
      font-size: 16px;
    }
    .createForm label {
      display: grid;
      gap: 7px;
      color: #6b563b;
      font-weight: 700;
    }
    .createForm input,
    .createForm select,
    .createForm textarea {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      padding: 0 11px;
      background: rgba(255,255,255,.78);
      color: var(--ink);
      font: inherit;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.78);
      cursor: auto;
    }
    .createForm textarea {
      min-height: 150px;
      resize: vertical;
      padding-top: 10px;
      line-height: 1.65;
    }
    .compactTextarea { min-height: 92px; }
    .checkLabel {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-weight: 700;
      color: #5c472e;
    }
    .checkLabel input {
      width: auto;
      min-height: 0;
      margin-top: 4px;
    }
    .checkText {
      display: grid;
      gap: 2px;
    }
    .conditional {
      display: grid;
      gap: 12px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(248, 242, 232, .72);
      border: 1px dashed rgba(138, 102, 55, .26);
    }
    .conditional.hidden { display: none; }
    .createActions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 4px;
    }
    .buttonRow {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .createActions button,
    .ruleToggle,
    .secondaryBtn {
      min-height: 40px;
      border-radius: 10px;
      padding: 0 14px;
      font-weight: 800;
    }
    .primaryCreate {
      color: white;
      border-color: rgba(120, 80, 32, .42);
      background: linear-gradient(180deg, #b98237, #8b5b22);
      box-shadow: 0 10px 20px rgba(129, 86, 36, .2);
    }
    .notice {
      min-height: 24px;
      color: #7c5526;
      font-weight: 700;
      line-height: 1.55;
    }
    .rulesSide {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px;
    }
    .rulesSideHeader h2,
    .rulesSideHeader p {
      margin: 0;
    }
    .rulesSideHeader p {
      margin-top: 5px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 13px;
    }
    .defaultRules {
      min-height: 0;
      overflow-y: auto;
      display: grid;
      align-content: start;
      gap: 9px;
    }
    .ruleCard {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,.62);
      overflow: hidden;
    }
    .ruleToggle {
      width: 100%;
      justify-content: space-between;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      background: rgba(255,255,255,.52);
    }
    .ruleCard pre {
      max-height: 220px;
      overflow: auto;
      padding: 12px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      cursor: auto;
    }
    .ruleFiles {
      display: block;
      color: var(--muted);
      font-size: 12px;
      padding: 0 12px 10px;
      overflow-wrap: anywhere;
    }
    @media (max-width: 920px) {
      .createLayout { grid-template-columns: 1fr; }
      .formGrid { grid-template-columns: 1fr; }
      .createHeader { display: grid; }
    }
  </style>
</head>
<body>
  <canvas id="rainCanvas" aria-hidden="true"></canvas>
  <main class="createShell" id="createScroller">
    <section class="createLayout">
      <div class="panel createMain">
        <div class="createHeader">
          <div>
            <h1>新建跑团</h1>
            <p>先确定故事模板、模型接入、规则显示和安全边界。这里只写初始化记忆，不触发正文生成。</p>
          </div>
          <button type="button" onclick="window.location.href='/'">返回控制台</button>
        </div>

        <form class="createForm" id="createForm">
          <section class="formSection">
            <h2>故事模板</h2>
            <div class="formGrid">
              <label>
                模板
                <select id="template" name="template">
                  <option value="custom">自定义</option>
                  <option value="coc">COC</option>
                  <option value="dnd">DND</option>
                </select>
              </label>
              <label>
                故事名称
                <input id="name" name="name" autocomplete="off" placeholder="给这个跑团取一个名字">
              </label>
            </div>
            <button class="secondaryBtn" id="restoreTemplateBtn" type="button">恢复模板默认值</button>
          </section>

          <section class="formSection">
            <h2>模型调用模式</h2>
            <label>
              模式
              <select id="model_mode" name="model_mode">
                <option value="dual_director_actor">V4 导演 + GPT 演员</option>
                <option value="deepseek_v4_only">DeepSeek V4 全流程</option>
                <option value="chatgpt_only">ChatGPT 全流程</option>
                <option value="custom_model">自定义模型接入</option>
              </select>
            </label>
            <div class="conditional hidden" id="customModelSection">
              <div class="formGrid">
                <label>
                  Provider
                  <select id="provider_type" name="provider_type">
                    <option value="openai_compatible">OpenAI Compatible</option>
                    <option value="deepseek_compatible">DeepSeek Compatible</option>
                    <option value="custom_http">Custom HTTP</option>
                  </select>
                </label>
                <label>
                  用途
                  <select id="custom_role" name="custom_role">
                    <option value="single">单模型全流程</option>
                    <option value="director">只做导演</option>
                    <option value="actor">只做演员</option>
                  </select>
                </label>
              </div>
              <label>
                Base URL
                <input id="custom_base_url" name="custom_base_url" placeholder="https://api.example.com/v1">
              </label>
              <label>
                模型名
                <input id="custom_model_name" name="custom_model_name" placeholder="deepseek-chat / qwen-plus / gpt-4o-mini">
              </label>
              <label>
                API Key
                <input id="custom_api_key" name="custom_api_key" type="password" autocomplete="new-password" placeholder="可留空，稍后在本地配置">
              </label>
              <p class="hintLine">真实 API Key 不写入 campaign_profile.json；后端只保存 custom_api_key_ref。</p>
            </div>
          </section>

          <section class="formSection">
            <h2>故事设定 / 开场 Prompt</h2>
            <label>
              用户 Prompt
              <textarea id="user_prompt" name="user_prompt" placeholder="请描述世界观、主角处境、开局钩子、故事基调和不想出现的内容。"></textarea>
            </label>
          </section>

          <section class="formSection">
            <h2>伙伴 / 副角色</h2>
            <label class="checkLabel">
              <input id="companion_enabled" name="companion_enabled" type="checkbox">
              <span class="checkText">启用伙伴 / 副角色<small>不勾选时不会生成伙伴卡，也不会默认生成任何伙伴类型。</small></span>
            </label>
            <div class="conditional hidden" id="companionSection">
              <div class="formGrid">
                <label>
                  生成方式
                  <select id="companion_mode" name="companion_mode">
                    <option value="auto">AI 自动生成</option>
                    <option value="manual">手动填写</option>
                  </select>
                </label>
                <label>
                  名称
                  <input id="companion_name" name="companion_name" placeholder="手动模式下建议填写">
                </label>
              </div>
              <label>
                定位
                <input id="companion_role" name="companion_role" placeholder="例如：向导、队友、守护者、联系人">
              </label>
              <label>
                性格
                <textarea class="compactTextarea" id="companion_personality" name="companion_personality"></textarea>
              </label>
              <label class="checkLabel">
                <input id="companion_card_visible" name="companion_card_visible" type="checkbox" checked>
                <span class="checkText">显示伙伴卡</span>
              </label>
            </div>
          </section>

          <section class="formSection">
            <h2>角色卡</h2>
            <label class="checkLabel">
              <input id="character_card_enabled" name="character_card_enabled" type="checkbox" checked>
              <span class="checkText">启用角色卡<small>关闭后，正文仍可描述状态，但初始化不要求明文角色卡。</small></span>
            </label>
            <div class="conditional" id="characterCardSection">
              <label>
                状态显示
                <select id="stat_visibility" name="stat_visibility">
                  <option value="narrative">叙事状态</option>
                  <option value="hybrid">半数值</option>
                  <option value="numeric">完整数值</option>
                </select>
              </label>
            </div>
          </section>

          <section class="formSection">
            <h2>骰子 / 检定</h2>
            <label class="checkLabel">
              <input id="dice_enabled" name="dice_enabled" type="checkbox">
              <span class="checkText">启用骰子 / 检定<small>骰子和角色卡互相独立，可单独开启或关闭。</small></span>
            </label>
            <div class="conditional hidden" id="diceSection">
              <div class="formGrid">
                <label>
                  骰子类型
                  <select id="dice_type" name="dice_type">
                    <option value="d100">d100</option>
                    <option value="d20">d20</option>
                    <option value="custom">custom</option>
                  </select>
                </label>
                <label>
                  检定模式
                  <select id="roll_mode" name="roll_mode">
                    <option value="percentile">percentile</option>
                    <option value="d20_attribute">d20_attribute</option>
                    <option value="narrative_check">narrative_check</option>
                    <option value="custom">custom</option>
                  </select>
                </label>
              </div>
              <label>
                检定属性
                <textarea class="compactTextarea" id="roll_attributes" name="roll_attributes" placeholder="每行一个属性"></textarea>
              </label>
            </div>
          </section>

          <section class="formSection">
            <h2>规则强度与主角模式</h2>
            <div class="formGrid">
              <label>
                规则强度
                <select id="rules_strictness" name="rules_strictness">
                  <option value="light">轻规则</option>
                  <option value="standard">标准</option>
                  <option value="strict">严格</option>
                </select>
              </label>
              <label>
                主角模式
                <select id="party_mode" name="party_mode">
                  <option value="solo">单主角</option>
                  <option value="party">小队</option>
                  <option value="ensemble">群像</option>
                </select>
              </label>
            </div>
          </section>

          <section class="formSection">
            <h2>安全边界 / 禁止内容</h2>
            <label>
              安全边界
              <textarea class="compactTextarea" id="safety_lines" name="safety_lines" placeholder="写下不想出现的内容、需要淡化的描写、禁止主题或玩家边界。"></textarea>
            </label>
          </section>

          <div class="createActions">
            <div class="notice" id="notice"></div>
            <div class="buttonRow">
              <button type="button" onclick="window.location.href='/'">取消</button>
              <button class="primaryCreate" id="createCampaignBtn" type="submit">创建并进入</button>
            </div>
          </div>
        </form>
      </div>

      <aside class="panel rulesSide">
        <div class="rulesSideHeader">
          <h2>内置规则</h2>
          <p>这些规则会由后端按跑团配置写入初始化记忆。新建页面不会触发正文生成。</p>
        </div>
        <div class="defaultRules" id="defaultRules"></div>
      </aside>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const canvas = $("rainCanvas");
    const ctx = canvas.getContext("2d");

    const TEMPLATE_DEFAULTS = {
      custom: {
        name: "",
        user_prompt: "",
        character_card_enabled: true,
        stat_visibility: "narrative",
        dice_enabled: false,
        dice_type: "",
        roll_mode: "",
        roll_attributes: [],
        rules_strictness: "light",
        party_mode: "solo",
      },
      coc: {
        name: "雾港调查档案",
        user_prompt: "一组调查员收到一份异常委托，前往一座被旧案、失踪者和地方传闻笼罩的城镇。希望强调线索调查、人物关系、理智压力、资料档案、隐秘真相和逐步升级的异常感。不要过早揭露真相。",
        character_card_enabled: true,
        stat_visibility: "numeric",
        dice_enabled: true,
        dice_type: "d100",
        roll_mode: "percentile",
        roll_attributes: ["侦查", "聆听", "图书馆使用", "心理学", "闪避", "理智"],
        rules_strictness: "standard",
        party_mode: "party",
      },
      dnd: {
        name: "边境地城远征",
        user_prompt: "一支初出茅庐的冒险队抵达边境城镇，第一份委托与失踪商队、地下遗迹和附近怪物活动有关。希望强调队伍协作、职业能力、探索、资源消耗、战斗风险和逐步展开的冒险主线。",
        character_card_enabled: true,
        stat_visibility: "numeric",
        dice_enabled: true,
        dice_type: "d20",
        roll_mode: "d20_attribute",
        roll_attributes: ["力量", "敏捷", "体质", "智力", "感知", "魅力"],
        rules_strictness: "standard",
        party_mode: "party",
      },
    };
    const dirty = { name: false, user_prompt: false };

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width = `${window.innerWidth}px`;
      canvas.style.height = `${window.innerHeight}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function frame() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      ctx.strokeStyle = "rgba(120, 92, 55, .06)";
      for (let i = 0; i < 44; i += 1) {
        ctx.beginPath();
        ctx.arc((i * 97) % window.innerWidth, (i * 53) % window.innerHeight, 42 + (i % 6) * 18, 0, Math.PI * 1.25);
        ctx.stroke();
      }
      requestAnimationFrame(frame);
    }

    function initDragScroll() {
      const dragState = { active: false, pointerId: 0, x: 0, y: 0, scrollX: 0, scrollY: 0 };
      const interactiveSelector = "button, input, select, textarea, a, pre, [data-rule-index]";
      document.addEventListener("pointerdown", (event) => {
        if (event.button !== 0 || event.target.closest(interactiveSelector)) return;
        dragState.active = true;
        dragState.pointerId = event.pointerId;
        dragState.x = event.clientX;
        dragState.y = event.clientY;
        dragState.scrollX = window.scrollX;
        dragState.scrollY = window.scrollY;
        document.body.classList.add("dragScrolling");
        document.body.setPointerCapture?.(event.pointerId);
      });
      document.addEventListener("pointermove", (event) => {
        if (!dragState.active || event.pointerId !== dragState.pointerId) return;
        event.preventDefault();
        window.scrollTo({
          left: dragState.scrollX + dragState.x - event.clientX,
          top: dragState.scrollY + dragState.y - event.clientY,
          behavior: "auto",
        });
      }, { passive: false });
      const stopDrag = (event) => {
        if (!dragState.active || event.pointerId !== dragState.pointerId) return;
        dragState.active = false;
        document.body.classList.remove("dragScrolling");
        document.body.releasePointerCapture?.(event.pointerId);
      };
      document.addEventListener("pointerup", stopDrag);
      document.addEventListener("pointercancel", stopDrag);
    }

    async function api(path, options = {}) {
      const res = await fetch(path, {
        headers: { "content-type": "application/json" },
        ...options,
      });
      const data = await res.json();
      if (!res.ok || data.ok === false) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    function notice(text) {
      $("notice").textContent = text || "";
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }

    function setChecked(id, value) {
      $(id).checked = Boolean(value);
    }

    function setValue(id, value) {
      $(id).value = Array.isArray(value) ? value.join("\n") : (value || "");
    }

    function applyTemplateDefaults(forceText = false) {
      const template = $("template").value;
      const defaults = TEMPLATE_DEFAULTS[template] || TEMPLATE_DEFAULTS.custom;
      const shouldFillEmptyName = template !== "custom" && !$("name").value.trim();
      const shouldFillEmptyPrompt = template !== "custom" && !$("user_prompt").value.trim();
      if (forceText || !dirty.name || shouldFillEmptyName) setValue("name", defaults.name);
      if (forceText || !dirty.user_prompt || shouldFillEmptyPrompt) setValue("user_prompt", defaults.user_prompt);
      setChecked("character_card_enabled", defaults.character_card_enabled);
      setValue("stat_visibility", defaults.stat_visibility);
      setChecked("dice_enabled", defaults.dice_enabled);
      setValue("dice_type", defaults.dice_type);
      setValue("roll_mode", defaults.roll_mode);
      setValue("roll_attributes", defaults.roll_attributes);
      setValue("rules_strictness", defaults.rules_strictness);
      setValue("party_mode", defaults.party_mode);
      if (forceText) {
        dirty.name = false;
        dirty.user_prompt = false;
      }
      syncConditionalSections();
    }

    function syncConditionalSections() {
      $("customModelSection").classList.toggle("hidden", $("model_mode").value !== "custom_model");
      $("companionSection").classList.toggle("hidden", !$("companion_enabled").checked);
      $("characterCardSection").classList.toggle("hidden", !$("character_card_enabled").checked);
      $("diceSection").classList.toggle("hidden", !$("dice_enabled").checked);
    }

    function splitLines(value) {
      return String(value || "").split(/[\n,，、]+/).map((line) => line.trim()).filter(Boolean);
    }

    function validateForm() {
      const errors = [];
      const warnings = [];
      if (!$("name").value.trim()) errors.push("故事名称必填。");
      if (!$("user_prompt").value.trim()) errors.push("用户 Prompt 必填。");
      if (!$("model_mode").value) errors.push("模型调用模式必填。");
      if ($("model_mode").value === "custom_model") {
        if (!$("custom_base_url").value.trim()) errors.push("自定义模型 Base URL 必填。");
        if (!$("custom_model_name").value.trim()) errors.push("自定义模型名必填。");
        if (!$("custom_role").value) errors.push("自定义模型用途必填。");
        if (!$("custom_api_key").value.trim()) warnings.push("API Key 留空，将使用本地已有密钥或稍后配置。");
      }
      if ($("companion_enabled").checked && $("companion_mode").value === "manual" && !$("companion_name").value.trim()) {
        errors.push("手动伙伴模式建议填写伙伴名称。");
      }
      if ($("dice_enabled").checked) {
        if (!$("dice_type").value) errors.push("骰子类型必填。");
        if (!$("roll_mode").value) errors.push("检定模式必填。");
        if (!splitLines($("roll_attributes").value).length) errors.push("检定属性至少填写一个。");
      }
      return { errors, warnings };
    }

    function payloadFromForm() {
      return {
        template: $("template").value,
        name: $("name").value.trim(),
        model_mode: $("model_mode").value,
        provider_type: $("provider_type").value,
        custom_base_url: $("custom_base_url").value.trim(),
        custom_model_name: $("custom_model_name").value.trim(),
        custom_api_key: $("custom_api_key").value,
        custom_role: $("custom_role").value,
        user_prompt: $("user_prompt").value.trim(),
        companion_enabled: $("companion_enabled").checked,
        companion_mode: $("companion_mode").value,
        companion_name: $("companion_name").value.trim(),
        companion_role: $("companion_role").value.trim(),
        companion_personality: $("companion_personality").value.trim(),
        companion_card_visible: $("companion_card_visible").checked,
        character_card_enabled: $("character_card_enabled").checked,
        stat_visibility: $("stat_visibility").value,
        dice_enabled: $("dice_enabled").checked,
        dice_type: $("dice_type").value,
        roll_mode: $("roll_mode").value,
        roll_attributes: splitLines($("roll_attributes").value),
        rules_strictness: $("rules_strictness").value,
        party_mode: $("party_mode").value,
        safety_lines: splitLines($("safety_lines").value),
      };
    }

    async function loadDefaults() {
      try {
        const data = await api("/api/new-campaign-defaults");
        const rows = data.defaults?.categories || [];
        $("defaultRules").innerHTML = rows.map((row, index) => `
          <article class="ruleCard">
            <button class="ruleToggle" type="button" data-rule-index="${index}">
              <span>${escapeHtml(row.title)}</span><b>+</b>
            </button>
            <span class="ruleFiles">${escapeHtml((row.files || []).join(" / "))}</span>
            <pre class="hidden">${escapeHtml(row.content || "暂无内容")}</pre>
          </article>
        `).join("");
        document.querySelectorAll("[data-rule-index]").forEach((button) => {
          button.addEventListener("click", () => {
            const pre = button.closest(".ruleCard").querySelector("pre");
            const collapsed = pre.classList.toggle("hidden");
            button.querySelector("b").textContent = collapsed ? "+" : "−";
          });
        });
      } catch (err) {
        $("defaultRules").innerHTML = `<p class="hintLine">${escapeHtml(err.message)}</p>`;
      }
    }

    async function createCampaign(event) {
      event.preventDefault();
      const { errors, warnings } = validateForm();
      if (errors.length) {
        notice(errors[0]);
        return;
      }
      const button = $("createCampaignBtn");
      button.disabled = true;
      const prefix = warnings.length ? `${warnings.join(" ")} ` : "";
      notice(`${prefix}正在创建跑团并写入初始化配置...`);
      try {
        const data = await api("/api/create-campaign-smart", {
          method: "POST",
          body: JSON.stringify(payloadFromForm()),
        });
        const genre = data.analysis?.genre || "已归纳";
        const tone = data.analysis?.tone || "已归纳";
        notice(`创建完成：${genre} / ${tone}，正在进入控制台。`);
        window.location.href = "/";
      } catch (err) {
        notice(err.message);
        button.disabled = false;
      }
    }

    window.addEventListener("resize", resize);
    $("template").addEventListener("change", () => applyTemplateDefaults(false));
    $("restoreTemplateBtn").addEventListener("click", () => applyTemplateDefaults(true));
    $("name").addEventListener("input", () => { dirty.name = true; });
    $("user_prompt").addEventListener("input", () => { dirty.user_prompt = true; });
    ["model_mode", "companion_enabled", "character_card_enabled", "dice_enabled"].forEach((id) => {
      $(id).addEventListener("change", syncConditionalSections);
    });
    $("createForm").addEventListener("submit", createCampaign);
    initDragScroll();
    resize();
    frame();
    applyTemplateDefaults(false);
    loadDefaults();
  </script>
</body>
</html>
